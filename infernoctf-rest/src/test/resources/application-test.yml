# Test profile: @ActiveProfiles("test") swaps the `local` profile's PostgreSQL for H2 so
# the suite runs with no external services.
spring:
  datasource:
    url: jdbc:h2:mem:infernoctf;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

# URL_PREFIX is only set in a deployed container; override so it never has to resolve.
server:
  servlet:
    contextPath: /infernoctf-rest

infernoctf:
  applicationName: InfernoCTF
  # A known bootstrap admin so the security tests can obtain an ADMIN token.
  defaultAdminUsername: infernoctf_admin
  defaultAdminPassword: test-admin-password
  chatService: ""
  chatSocket: ""

logging:
  level:
    org.hibernate: WARN

app:
  jwt:
    # A temp dir, so the suite never writes into /data/certs.
    key-dir: ${java.io.tmpdir}/infernoctf-test-keys
  cors:
    allowed-origins: http://localhost:4301
