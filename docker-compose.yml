services:
  infernoctf-web:
    image: infernokun/infernoctf-web:latest
    restart: always
    environment:
      - BASE_URL=http://infernoctf-web
      - REST_URL=/api
    ports:
      - "8774:80"
    volumes:
      - infernoctf-web:/var/log/nginx
    depends_on:
      infernoctf-db:
        condition: service_healthy

  infernoctf-db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-infernoctf}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-infernoctf}"
      POSTGRES_DB: "${POSTGRES_DB:-infernoctf}"
    volumes:
      - infernoctf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infernoctf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  infernoctf-rest:
    image: infernokun/infernoctf-rest:latest
    restart: always
    ports:
      - "8775:8080"
    environment:
      DB_IP: "${POSTGRES_IP:-infernoctf-db}"
      DB_NAME: "${POSTGRES_DB:-infernoctf}"
      DB_USER: "${POSTGRES_USER:-infernoctf}"
      DB_PASS: "${POSTGRES_PASSWORD:-infernoctf}"
      DB_PORT: "${DB_PORT:-5432}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-secret_key}"
      PORT: 8080
      # Unset DEFAULT_ADMIN_PASSWORD means a random one is generated and printed once.
      DEFAULT_ADMIN_USERNAME: "${DEFAULT_ADMIN_USERNAME:-infernoctf_admin}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-}"
      # Must be on the persistent volume below: a key generated per boot logs every user out
      # on each restart.
      JWT_KEY_DIR: /data/certs/jwt
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-PT15M}"
      JWT_REFRESH_TOKEN_TTL: "${JWT_REFRESH_TOKEN_TTL:-P14D}"
      # Lax suits the same-origin SPA; another origin needs None, and therefore Secure.
      JWT_REFRESH_COOKIE_SAME_SITE: "${JWT_REFRESH_COOKIE_SAME_SITE:-Lax}"
      # false only for plain HTTP on a non-localhost host, or the browser drops the cookie.
      JWT_REFRESH_COOKIE_SECURE: "${JWT_REFRESH_COOKIE_SECURE:-true}"
      # Server-side login throttling.
      LOGIN_MAX_ATTEMPTS_PER_ACCOUNT: "${LOGIN_MAX_ATTEMPTS_PER_ACCOUNT:-5}"
      LOGIN_MAX_ATTEMPTS_PER_SOURCE: "${LOGIN_MAX_ATTEMPTS_PER_SOURCE:-20}"
      # Also gates the WebSocket handshake's Origin check.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4301,http://localhost:4200}"
    volumes:
      - infernoctf-certs:/data/certs
    depends_on:
      - infernoctf-db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  infernoctf-db:
    driver: local
  infernoctf-web:
  # JWT signing key pair. Deleting this volume invalidates every issued token.
  infernoctf-certs:
    driver: local
