worker_processes 1;
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$http_ssl_client_s_dn_cn" ';
                    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # Health Check Endpoint
        location = /health {
          default_type application/json;
          return 200 '{"success": {"status_code": 200, "status": "OK"}}';
        }

        # Serve Static Files
        location = / {
          index index.html;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }

        # API Proxy
        location /api/ {
          proxy_pass http://infernoctf-rest:8080/infernoctf-rest/api/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          # CORS is handled by the API (SecurityConfig). Adding headers here would duplicate
          # them, and a wildcard origin is rejected once credentials are involved.
        }

        # Needs HTTP/1.1 and the Upgrade/Connection headers, which proxy_pass drops.
        location /socket-handler/ {
          proxy_pass http://infernoctf-rest:8080/infernoctf-rest/socket-handler/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          # Long-lived connections; the 60s default drops them on every idle gap.
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }

        # Error Handling
        error_page 500 502 503 504 /50x.html;
        client_max_body_size 100M;
        underscores_in_headers on;
    }
}
